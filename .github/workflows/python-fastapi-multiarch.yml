# =============================================================================
# Example 1 - python-fastapi-multiarch
# =============================================================================
#
# Build an ARM64-only image from examples/python-fastapi-multiarch.
#
# There is only one architecture to produce, so we build it NATIVELY on a
# GitHub-hosted ARM64 runner. No QEMU, no emulation, no manifest merge - the
# build runs at full speed on the same CPU family the image targets.
#
# Published image:  <DOCKER_IMAGE>:python-arm64   (linux/arm64 only)
#
# Requires:
#   - repository variable DOCKER_IMAGE   (e.g. "darktohka/multiarch-lab")
#   - repository secret   DOCKERHUB_TOKEN (Docker Hub PAT, Read & Write)
# =============================================================================

name: python-fastapi-multiarch

on:
  push:
  workflow_dispatch:

# The workflow only reads the repository; it authenticates to Docker Hub with
# its own token, so the default GITHUB_TOKEN needs no extra scopes.
permissions:
  contents: read

env:
  # Single, configurable image repository. Every example publishes a different
  # tag on it. Override DOCKER_IMAGE under
  # Settings -> Secrets and variables -> Actions -> Variables.
  DOCKER_IMAGE: ${{ vars.DOCKER_IMAGE || 'your-dockerhub-username/multiarch-lab' }}
  TAG: python-arm64

jobs:
  build-arm64:
    name: Build linux/arm64 natively
    # GitHub-hosted ARM64 runner. Fallback: ubuntu-24.04-arm.
    runs-on: ubuntu-26.04-arm
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Derive the Docker Hub username from DOCKER_IMAGE
        id: dockerhub
        run: echo "username=${DOCKER_IMAGE%%/*}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ steps.dockerhub.outputs.username }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push the ARM64 image
        uses: docker/build-push-action@v7
        with:
          context: examples/python-fastapi-multiarch
          platforms: linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: ${{ env.DOCKER_IMAGE }}:${{ env.TAG }}

      - name: Prove the runner is really ARM64 and the image runs
        run: |
          echo "runner architecture: $(uname -m)"
          docker run --rm "${{ env.DOCKER_IMAGE }}:${{ env.TAG }}" uname -m

      - name: Inspect the published manifest
        run: docker buildx imagetools inspect "${{ env.DOCKER_IMAGE }}:${{ env.TAG }}"
